<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HolidayBooking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>HolidayBooking</h1>
        <p>Hotels in Sri Lanka, Dubai, Singapore, London and more. Find a room, book it, or cancel a stay.</p>
      </div>
      <div class="header-links">
        <a id="callUs" class="call-link" hidden></a>
        <a href="admin.html" class="staff-link">Staff login</a>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>1. Find a hotel</h2>
        <form id="search" class="row">
          <label>Where <select id="where"><option value="">Anywhere</option></select></label>
          <label>Check-in <input type="date" id="checkIn" required /></label>
          <label>Check-out <input type="date" id="checkOut" required /></label>
          <button type="submit" class="primary">Search</button>
        </form>
        <p id="searchError" class="error" role="alert" hidden></p>
        <div id="results"></div>
      </section>

      <section class="card" id="bookingCard" hidden>
        <h2>2. Book <span id="bookingTitle"></span></h2>
        <form id="book" class="stack">
          <label>Guest name <input id="guestName" required maxlength="120" /></label>
          <label>Email <input id="guestEmail" type="email" required /></label>
          <label>Guests <input id="guests" type="number" min="1" value="1" required /></label>
          <p id="bookingSummary" class="muted"></p>
          <p id="bookError" class="error" role="alert" hidden></p>
          <div class="row">
            <button type="submit" class="primary">Confirm booking</button>
            <button type="button" id="cancelBook">Back</button>
          </div>
        </form>
        <p id="bookOk" class="ok" role="status" hidden></p>
      </section>

      <section class="card">
        <h2>My bookings</h2>
        <form id="lookup" class="row">
          <label>Email <input id="lookupEmail" type="email" required /></label>
          <button type="submit">Find my bookings</button>
        </form>
        <p id="lookupError" class="error" role="alert" hidden></p>
        <div id="bookings"></div>
      </section>
    </main>

    <script src="common.js"></script>
    <script src="app.js"></script>
  </body>
</html>
